# Local stack: the service, Prometheus with the alert rules, and Grafana
# with the Tetra dashboard. `docker compose --profile test run --rm smoke`
# runs the contract test against it.
name: tetra-ruby

services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
    image: tetra-ruby:local
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: info
      DRAIN_DELAY_SECONDS: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "bundle", "exec", "bin/healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tetra.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  smoke:
    image: curlimages/curl:8.15.0
    profiles: [test]
    entrypoint: ["/bin/sh", "/scripts/smoke.sh", "http://app:8000"]
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      app:
        condition: service_healthy
